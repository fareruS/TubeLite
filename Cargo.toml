[workspace]
members = [
    "crates/yt-model",
    "crates/yt-source",
    "crates/player",
    "crates/store",
    "crates/innertube",
    "crates/feeds",
    "crates/accounts",
    "crates/tools/replay",
    "crates/tools/redact",
    "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "TBD — owner must choose (see docs/PLAN.md §6.1; do not ship without a LICENSE file)"
authors = ["TubeLite contributors"]

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["preserve_order"] }
thiserror = "=2.0.12"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream", "json"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter"] }
chrono = { version = "=0.4.40", default-features = false, features = ["clock", "serde"] }
url = "=2.5.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
# opt-level="s" for non-hot crates is a per-package override to evaluate
# by measurement only — not enabled globally here.
