[package]
name = "tubelite"
version = "0.1.0"
edition = "2021"
description = "TubeLite — lightweight native desktop YouTube video client (Tauri 2 + Rust + Svelte + libmpv)."
license = "TBD"

[features]
default = []
# Playback: enables the libmpv-backed PlayerService. OFF by default so
# `cargo test --all` (and CI on ubuntu-latest, which has no libmpv) still
# builds and runs — playback commands then return a clear error.
# Release builds enable it: `cargo build --features mpv`.
mpv = ["player/mpv"]

[target.'cfg(windows)'.dependencies]
# Minimal Win32 surface for embedding mpv (`wid`): child-window
# creation/placement only. Same major version Tauri itself uses, so
# no new crate enters the lockfile.
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.145" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter"] }
yt-model = { path = "../crates/yt-model" }
yt-source = { path = "../crates/yt-source" }
player = { path = "../crates/player" }
store = { path = "../crates/store" }
accounts = { path = "../crates/accounts" }
innertube = { path = "../crates/innertube" }
feeds = { path = "../crates/feeds" }
thiserror = "=2.0.12"
async-trait = "=0.1.88"
reqwest.workspace = true
